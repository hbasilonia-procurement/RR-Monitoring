<script>const em=v=>v==null||v==='';
const EF=['po','supplier','bu','buyer','ln','item','desc','uom','qty','price','ord','q','d','sd','dr','si','rr','ap','rb'];
const BUY0=[{n:'Arlene',r:'Buyer'},{n:'Ellaris',r:'Buyer'},{n:'Frayla',r:'Buyer'},{n:'Carla',r:'Senior Buyer'},{n:'Sherwin',r:'Senior Buyer'},{n:'Vanesa',r:'Proc. Manager'}],BYL=()=>D.buyers&&D.buyers.length?D.buyers:BUY0;
function isBlank(e){return !e.nd&&EF.every(f=>em(e[f]))&&!Object.values(e.x||{}).some(v=>!em(v))}
/* document numbers: plain numbers stay numbers; leading zeros, dots and slashes are kept as text (0217883, 16443.16442) */
const dtx=v=>{v=String(v==null?'':v).trim();return /^[1-9]\d{0,14}$/.test(v)?Number(v):v};
/* delivery progress of one PO. % delivered = received value / ordered value. A closed line counts only what was received. */
function pEff(p){let q=0,g=0,j=0,v=0,ej=0,eq=0,ov=0,cl=0,f=null;
  p.lines.forEach(l=>{const gl=l.rec.reduce((a,r)=>a+(Number(r.q)||0),0),pr=Number(l.price)||0,qy=Number(l.qty)||0,e=l.cl?Math.min(qy,gl):qy;
    q+=qy;g+=gl;j+=Number(l.ordered)||qy*pr;v+=gl*pr;ej+=e*pr;eq+=e;if(gl>qy&&qy>0)ov++;if(l.cl&&gl<qy)cl++;
    l.rec.forEach(r=>{if(r.d&&(!f||r.d<f))f=r.d})});
  const pct=ej?v/ej:eq?g/eq:(cl?1:0),und=Math.max(0,1-pct);
  const s=ov?'Over-delivered':(g===0&&!cl)?'Pending':pct>=0.99999?(cl?'Closed short':'Complete'):'Partial';
  return{q,g,j,v,ej,eq,pct,und,s,f,ov,cl}}
/* Oracle prices can have 4+ decimals (2,151.9041). When a pasted Ordered amount differs from Qty x Price only because
   the price was copied rounded, the unit price is recalculated from Ordered / Qty so Qty x Price = Ordered exactly. */
function fixOrd(e){if(!e)return false;const q=Number(e.qty),pr=Number(e.price),od=Number(e.ord);
  if(e.ord==null||e.ord===''||!(q>0)||isNaN(pr)||isNaN(od)||Math.abs(od-q*pr)<=0.005||Math.abs(od/q-pr)>=0.01)return false;
  e.price=+(od/q).toFixed(6);return true}
function colName(n){let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
function colNum(s){return [...s].reduce((a,c)=>a*26+c.charCodeAt(0)-64,0)}

function summaryRows(all){return all.map(p=>{let q=0,g=0,tot=0,rv=0,lc=0,si=0,f=null,l=null;
  p.lines.forEach(x=>{q+=x.qty;tot+=x.ordered;const gl=x.rec.reduce((a,r)=>a+(r.q||0),0);g+=gl;rv+=gl*x.price;if(x.qty-gl<=0||x.cl)lc++;
    x.rec.forEach(r=>{if(r.si!=null)si++;if(r.d){if(!f||r.d<f)f=r.d;if(!l||r.d>l)l=r.d}})});
  return{po:p.po,supplier:p.supplier,bu:p.bu,buyer:p.buyer||'',lines:p.lines.length,lc,lo:p.lines.length-lc,q,g,bal:q-g,tot,rv,und:tot-rv,...(E=>({pct:E.pct,undp:E.und,st:E.s,ej:E.ej,cl:E.cl,ov:E.ov}))(pEff(p)),f,l,si}})}
function sumAgg(R){const a={n:R.length,lines:0,lc:0,lo:0,q:0,g:0,bal:0,tot:0,rv:0,und:0,ej:0};R.forEach(r=>['lines','lc','lo','q','g','bal','tot','rv','und','ej'].forEach(k=>a[k]+=r[k]||0));a.pct=a.ej?a.rv/a.ej:a.q?a.g/a.q:0;a.undp=Math.max(0,1-a.pct);return a}
/* Grouping: supplier = FIRST WORD of the name (KLG INT'L INC FSD / KLG INTERNATIONAL INC -> KLG); BU = code before the first hyphen (ASF-TNM -> ASF). Stored names are never changed. */
function supKey(v){const t=String(v==null?'':v).toUpperCase().replace(/['\u2019`]/g,'').replace(/[^A-Z0-9& ]/g,' ').trim().split(/\s+/)[0];return t||''}
function buKey(v){return String(v==null?'':v).toUpperCase().trim().split(/[\s\-–—]+/)[0]||''}
const GK={supplier:supKey,bu:buKey};
function sumGroup(R,key){const m=new Map(),f=GK[key]||(x=>String(x==null?'':x).trim());R.forEach(r=>{const k=f(r[key])||'(blank)';if(!m.has(k))m.set(k,[]);m.get(k).push(r)});return [...m].map(([k,v])=>{const a=sumAgg(v);a.names=[...new Set(v.map(r=>String(r[key]||'').replace(/\s+/g,' ').trim()).filter(Boolean))].sort();return [k,a]})}
function deriveEnt(E){
  const pos=[];let po=null,ln=null;
  E.forEach((e,i)=>{
    if(isBlank(e)){po=null;ln=null;return}
    if(!po||(!em(e.po)&&e.po!==po.po)||(Number(e.ln)===1&&po.lines.length)){po={po:e.po??'',supplier:e.supplier??'',bu:e.bu??'',buyer:e.buyer??'',lines:[],_i:i};pos.push(po);ln=null}
    const rec={q:em(e.q)?null:e.q,d:e.d||null,sd:e.sd||null,dr:em(e.dr)?null:e.dr,si:em(e.si)?null:e.si,amt:{f:'LI'},rr:em(e.rr)?null:e.rr,ap:e.ap||null,rb:em(e.rb)?null:e.rb,_i:i};
    if(!['ln','item','desc','uom','qty','price'].some(f=>!em(e[f]))&&ln){ln.rec.push(rec);return}
    const prev=po.lines.length?po.lines[po.lines.length-1].ln:0,q=e.qty||0,p=e.price||0;
    ln={ln:em(e.ln)?prev+1:e.ln,item:e.item??'',desc:e.desc??'',uom:e.uom??'',qty:q,price:p,ordered:q*p,calc:true,rec:[rec],x:e.x&&Object.keys(e.x).length?e.x:null,cl:e.cl||null,ovr:e.ovr||null,_i:i};
    po.lines.push(ln)});
  return pos}
function buildWorkbook(ExcelJS, D){
  const wb=new ExcelJS.Workbook();
  const VW=()=>({views:[{state:'frozen',xSplit:2,ySplit:1,showGridLines:false,zoomScale:90}],pageSetup:{orientation:'landscape',printTitlesRow:'1:1'}});
  const wsB=wb.addWorksheet('Summary by Buyer'),ws0=wb.addWorksheet('Sheet2',VW()),wsS0=wb.addWorksheet('Summary Report');wb.addWorksheet('Sheet1');
  const ALL=D.pos.concat(deriveEnt(D.ent||[]));
  const H=['PO #','Supplier','BU','Line','Item','Description','UOM','Quantity','Price','Ordered','Total','Qty Received','Date Received','SI Date','DR','SI#','SI Amount','RR','Balance','AP Endorsement Date','Received By','% Delivered','% Undelivered'];
  const W=[15,30,12,6,18,50,8,10,11,13,14,10,12,12,10,null,13,9,10,16,18,11,13];
  const GR='FFBFBFBF',NV='FF1F3864';
  const bd=(top)=>({left:{style:'thin',color:{argb:GR}},right:{style:'thin',color:{argb:GR}},bottom:{style:'thin',color:{argb:GR}},top:top?{style:'medium',color:{argb:NV}}:{style:'thin',color:{argb:GR}}});
  const fill=a=>({type:'pattern',pattern:'solid',fgColor:{argb:a}});
  const c3='#,##0.00;\\-#,##0.00;\\-', c0='#,##0;\\-#,##0;\\-';
  // [numFmt, horizontal, wrap, bold]
  const S=[['@','center',1,1],['General','left',1],['General','center',1],['0','center'],['@','left',1],['@','left',1],['@','center'],['#,##0','right'],['#,##0.00##','right'],['#,##0.00','right'],['#,##0.00','right',0,1],['#,##0','right'],['mm/dd/yyyy','center'],['mm/dd/yyyy','center'],['General','center'],['General','center'],[c3,'right'],['General','center'],[c0,'right'],['mm/dd/yyyy','center'],['General','left',1],['0.0%','center',0,1],['0.0%','center',0,1]];
  const build=(ws,wsS,all,name,ttl,blank)=>{
  W.forEach((w,i)=>{if(w)ws.getColumn(i+1).width=w});
  const hr=ws.getRow(1); hr.height=30;
  H.forEach((t,i)=>{const c=hr.getCell(i+1);c.value=t;c.font={name:'Arial',size:10,bold:true,color:{argb:'FFFFFFFF'}};c.fill=fill(NV);c.alignment={horizontal:'center',vertical:'middle',wrapText:true};c.border={left:{style:'thin',color:{argb:GR}},right:{style:'thin',color:{argb:GR}},top:{style:'medium',color:{argb:NV}},bottom:{style:'medium',color:{argb:NV}}}});
  ws.getCell('M1').numFmt='mm/dd/yy;@'; ws.getCell('N1').numFmt='mm/dd/yy;@'; ws.getCell('Q1').numFmt='_(* #,##0.00_);_(* \\(#,##0.00\\);_(* \\-??_);_(@_)';
  const sty=(r,col,bg,top)=>{const c=ws.getCell(r,col+1),s=S[col];c.numFmt=s[0];c.font={name:'Arial',size:10,bold:!!s[3]};c.fill=fill(bg);c.alignment={horizontal:s[1],vertical:'middle',wrapText:!!s[2]};c.border=bd(top);return c};
  let r=2; const merges=[];
  const rng=[];
  all.forEach((p,pi)=>{
    const bg=pi%2?'FFEAF0F8':'FFFFFFFF', first=r;
    const span=p.lines.reduce((a,l)=>a+l.rec.length,0), last=first+span-1;rng.push([first,last]);
    const sumQ=p.lines.reduce((a,l)=>a+l.qty,0);
    let sumJ=0,sumL=0,sumR=0;
    p.lines.forEach(l=>{sumJ+=l.ordered;const rc=l.rec.reduce((a,x)=>a+(x.q||0),0);sumL+=rc;sumR+=l.qty-rc});
    p.lines.forEach(l=>{
      const lr=r, n=l.rec.length, got=l.rec.reduce((a,x)=>a+(x.q||0),0);
      if(l.h)ws.getRow(lr).height=l.h;
      l.rec.forEach((x,k)=>{
        const rr=r+k, top=rr===first;
        for(let c=0;c<23;c++)sty(rr,c,bg,top);
        if(k===0){
          if(rr===first){
            ws.getCell(rr,1).value=p.po; ws.getCell(rr,2).value=p.supplier; ws.getCell(rr,3).value=p.bu;
            ws.getCell(rr,11).value={formula:`SUM(J${first}:J${last})`,result:sumJ};
            {const E=pEff(p);if(E.cl){ws.getCell(rr,22).value=E.pct;ws.getCell(rr,23).value=E.und}else{
            ws.getCell(rr,22).value={formula:`IF(SUM(J${first}:J${last})=0,0,SUM(Q${first}:Q${last})/SUM(J${first}:J${last}))`,result:E.pct};
            ws.getCell(rr,23).value={formula:`IF(SUM(J${first}:J${last})=0,0,MAX(0,1-SUM(Q${first}:Q${last})/SUM(J${first}:J${last})))`,result:E.und}}}
            [1,2,3,11,22,23].forEach(c=>merges.push([first,c,last,c]));
          }
